<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050814">
  <title>Telepon Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="top-header">
      <div class="heading-row">
        <div>
          <h1>Telepon</h1>
          <p class="connection-status"><span class="status-dot"></span>Disalin.</p>
        </div>
      </div>
      <section class="deadline-row" aria-label="Waktu tugas berakhir">
        <h2>Waktu Tugas Berakhir</h2>
        <div class="countdown" aria-live="off">
          <span id="hours">04</span><b>:</b><span id="minutes">49</span><b>:</b><span id="seconds">21</span>
        </div>
      </section>
    </header>

    <nav class="tabs" aria-label="Filter data">
      <button class="tab active" data-tab="all">Semua <span id="count-all">(1)</span></button>
      <button class="tab" data-tab="done">Selesai <span id="count-done">(1)</span></button>
      <button class="tab" data-tab="pending">Belum Selesai <span id="count-pending">(0)</span></button>
    </nav>

    <section class="toolbar">
      <button class="return-button" id="returnButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92Z"/></svg>
        <span>Kunjungan Ulang</span>
        <span class="visit-count" id="visitCount">2</span>
      </button>
      <label class="search-box">
        <input id="searchInput" type="search" placeholder="Cari nomor..." value="3059" autocomplete="off" aria-label="Cari nomor telepon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m16.5 16.5 5 5"/></svg>
      </label>
    </section>

    <section class="list-area">
      <div class="list-heading"><span>Nomor &amp; Nama</span><span>Hasil</span></div>
      <div class="list-divider"></div>
      <div id="records" class="records"></div>
      <p id="emptyState" class="empty-state" hidden>Data tidak ditemukan.</p>
    </section>
  </main>

  <div class="modal-backdrop" id="editModal" aria-hidden="true">
    <section class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="closeModal" type="button" aria-label="Tutup">×</button>
      <h2 id="modalTitle">Edit Nomor Telepon</h2>
      <label class="modal-label" for="phoneInput">Nomor telepon</label>
      <input id="phoneInput" class="phone-input" type="tel" inputmode="tel" autocomplete="tel" placeholder="Contoh: 62853422312123">
      <p class="format-hint">Format otomatis: 62xxxxxxxxxxx</p>
      <div class="modal-actions">
        <button class="cancel-button" id="cancelEdit" type="button">Batal</button>
        <button class="save-button" id="saveEdit" type="button">Simpan</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
